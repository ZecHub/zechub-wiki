name: Dictionary-key report

# Reports which dictionary keys are missing from each locale against
# dictionaries/en.json, which are left over from an English rename, and which
# diverge in shape. REPORT ONLY — it never fails a PR: a missing key falls back
# to English at runtime, so it is a backlog item, not a broken tree.
#
# The complementary hard gate is Menu-label coverage
# (.github/workflows/menu-labels.yml), which owns the menuLabels / exploreMenu
# namespaces and does fail. This report covers every OTHER namespace, which had
# no coverage at all. Detection only; no secrets.
#
# See scripts/check-dictionary-keys.mjs.

# Least privilege: the report only reads the tree. Also stops the checkout token
# from being persisted where PR-controlled code (deps, imported modules) could
# reach it.
permissions:
  contents: read

on:
  push:
    paths:
      - "dictionaries/**"
      - "src/i18n/routing.ts" # CANONICAL_LOCALES is derived from here
      - "scripts/check-dictionary-keys.mjs"
      - "scripts/lib/**" # the report's own logic
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/dictionary-keys.yml"
  pull_request:
    paths:
      - "dictionaries/**"
      - "src/i18n/routing.ts"
      - "scripts/check-dictionary-keys.mjs"
      - "scripts/lib/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/dictionary-keys.yml"

jobs:
  dictionary-key-report:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin actions to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches the menu-label gate
          cache: yarn
      # Install is needed because the locale list is IMPORTED from
      # src/i18n/routing.ts (via tsx) rather than regex-parsed, the same way the
      # menu-label gate reads it. --ignore-scripts so a malicious PR dependency
      # can't run lifecycle code in CI.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Report dictionary-key coverage
        # The script always exits 0 on a successful report; continue-on-error
        # guarantees the report can never turn a PR red even if the script
        # itself throws (a bad en.json, a tsx failure). Drop this line, and the
        # --strict flag becomes a real gate — deliberately not done here.
        continue-on-error: true
        run: yarn tsx scripts/check-dictionary-keys.mjs
