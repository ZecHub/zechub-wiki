name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      # Match the existing egress job: no production credentials are required.
      NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
      SUPABASE_SERVICE_ROLE_KEY: "dummy"
      OPENAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
      # Serve real content pages. Without a content source every wiki route is
      # the not-found page, so the checks below ran against it and passed
      # without exercising the page. ZecHub/zechub is public: raw files come
      # from the CDN. GITHUB_TOKEN (read-only) is set only on the steps that
      # build and serve the site, to lift the contents-API rate limit.
      OWNER: "ZecHub"
      REPO: "zechub"
      BRANCH: "main"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn build
      # playwright.config.ts starts the built app and enforces readiness.
      - name: Run all Playwright tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn playwright test
      - name: Upload Playwright report and traces
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
